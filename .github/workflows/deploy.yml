name: Deploy UI to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason (optional)'
        required: false
        default: 'manual trigger'

concurrency:
  group: deploy-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy UI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # This key is restricted on the server to a forced command
          # (saimor-deploy-ui-gate, saimor-ops). The server ignores any script; the gate
          # only accepts this one line, runs the UI deploy and fails unless it was recorded.
          script: deploy ui

      - name: Confirm
        run: echo "UI deployed at $(date -u)"
