name: Deploy UI to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason (optional)'
        required: false
        default: 'manual trigger'

concurrency:
  group: deploy-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy UI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo bash -lc '
              set -euo pipefail
              git -C /root/saimor/ops fetch origin main
              git -C /root/saimor/ops checkout main
              git -C /root/saimor/ops pull --ff-only origin main
              cd /root/saimor/ops
              bash deploy-ui.sh
            '

      - name: Confirm
        run: echo "UI deployed at $(date -u)"
