name: Finance native route once

on:
  push:
    branches:
      - sol/fin-02-state-flow
    paths:
      - '.github/workflows/finance-native-route-once.yml'

permissions:
  contents: write

jobs:
  route-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fin-02-state-flow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Route Finance business workflow to native pane
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/os/BusinessWorkflows.tsx')
          text = path.read_text()
          marker = "        id: 'finance',\n        action: { kind: 'desk' },"
          replacement = "        id: 'finance',\n        action: { kind: 'pane', id: 'finance', size: { width: 1120, height: 760 } },"
          if marker not in text:
              raise SystemExit('Expected Finance desk route not found; refusing blind rewrite')
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Verify types and Finance contract tests
        run: |
          npm run verify:types
          npx jest --runInBand __tests__/lib/queries/useFinanceStateFlow.test.ts
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finance-native-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/os/BusinessWorkflows.tsx
          git commit -m 'Finance: open native pane from business workflow'
          git push origin HEAD:sol/fin-02-state-flow
