name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**

concurrency:
  group: interface-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run verify:types

      - name: Critical flow gate
        run: npm run verify:critical-flow

      - name: OS smoke
        run: npm run verify:os:smoke

      - name: Unit tests
        run: npm test -- --runInBand --json --outputFile=/tmp/jest-results.json || (node -e "const r=require('/tmp/jest-results.json'); r.testResults.filter(s=>s.status==='failed').forEach(s=>{console.log('FAIL:',s.testFilePath.split('/').pop()); s.testResults.filter(t=>t.status==='failed').forEach(t=>console.log('  x',t.fullName, '-', t.failureMessages[0]?.slice(0,200)))})" && exit 1)

      - name: Production build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy UI to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/saimor/ops
            bash deploy-ui.sh
