name: Build and Publish UI Image (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ghcr-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  UI_IMAGE: ghcr.io/saimor-world/mora-ui

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run verify:types

      - name: Critical flow gate
        run: npm run verify:critical-flow

      - name: OS smoke
        run: npm run verify:os:smoke

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: UI metadata
        id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CORE_API_URL=https://api.saimor.world
            NEXT_PUBLIC_CORE_WS_URL=wss://api.saimor.world
            NEXT_PUBLIC_SAIMOR_CORE_URL=https://api.saimor.world
            NEXT_PUBLIC_ALLOW_TOOL_EXECUTION=true
            NEXT_PUBLIC_DISABLE_WEBGL=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
