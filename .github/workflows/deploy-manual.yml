name: Deploy to Production (Manual)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy (optional)'
        required: false
        default: 'manual trigger'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy UI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Restricted server-side to saimor-deploy-ui-gate: only this line is accepted.
          script: deploy ui

      - name: Confirm
        run: echo "Deployed at $(date -u) — ${{ github.event.inputs.reason }}"
