<!doctype html><html lang="de"><head><meta charset="utf-8"><title>MÔRA – Arbeitskarte</title>
<style>
:root{--ink:#06080a;--cream:247,244,233;--gold:#D6A848;--amber:232,156,74;--ok:132,200,170}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:rgb(var(--cream));font-family:Inter,-apple-system,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse 60% 55% at 50% 52%,rgba(60,46,24,.38),transparent 70%),radial-gradient(ellipse 50% 40% at 85% 10%,rgba(40,60,90,.14),transparent 70%),#06080a}
.nav{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:26px;font-size:12px;letter-spacing:.06em;color:rgba(var(--cream),.5)}.nav b{color:var(--gold);font-weight:500}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font:300 34px/1.08 "Cormorant Garamond",Georgia,serif;margin:12px 0 6px;letter-spacing:-.01em}
.sub{font-size:13.5px;color:rgba(var(--cream),.66);line-height:1.5}
.sec{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--cream),.5);margin:0 0 10px}
.card{display:grid;grid-template-columns:10px 1fr auto;gap:10px 12px;align-items:start;padding:12px 0;border-top:1px solid rgba(var(--cream),.08)}
.card:first-of-type{border-top:0}.dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.card .t{font-size:13.5px;line-height:1.35;color:rgba(var(--cream),.95)}.card .w{font-size:12px;line-height:1.4;color:rgba(var(--cream),.58);margin-top:3px}
.card .p{font-size:11px;color:rgba(var(--cream),.45);margin-top:5px;letter-spacing:.02em}
.btn{font:500 12px/1 Inter,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid rgba(var(--cream),.16);color:rgba(var(--cream),.92);background:rgba(var(--cream),.04);white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#E3BC63,#C9973A);color:#120d04;border:0}
.log li{list-style:none;display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid rgba(var(--cream),.06);font-size:12.5px;color:rgba(var(--cream),.8)}
.log li span{color:rgba(var(--cream),.45);font-size:11.5px}.log{margin:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(var(--cream),.12);color:rgba(var(--cream),.75)}
.chip i{font-style:normal;color:rgba(var(--cream),.42);margin-left:6px}.chip.on{background:rgba(var(--cream),.92);color:#0b0c0d;border-color:transparent}.chip.on i{color:rgba(0,0,0,.5)}
.map{position:absolute}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle at 50% 45%,rgba(243,223,174,.16),rgba(214,168,72,.06) 60%,transparent 72%);box-shadow:inset 0 0 0 1px rgba(214,168,72,.28)}
.core b{display:block;font:500 12px/1 Inter;letter-spacing:.28em;color:#F3DFAE;padding-left:.28em}.core small{display:block;margin-top:7px;font-size:11.5px;color:rgba(var(--cream),.6)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(var(--cream),.07);transform:translate(-50%,-50%)}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:170px;cursor:pointer}
.pl .s{position:relative;width:var(--d);height:var(--d)}.pl img{width:130%;height:130%;margin:-15%;display:block}
.pl .badge{position:absolute;right:-2px;top:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font:600 12px/22px Inter;color:#160e03;background:#E9B15A;box-shadow:0 0 0 3px var(--ink)}
.pl[data-u=high] .s::before{content:"";position:absolute;inset:-10px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(var(--amber),.75),0 0 28px 6px rgba(var(--amber),.28)}
.pl[data-u=mid] .s::before{content:"";position:absolute;inset:-8px;border-radius:50%;box-shadow:0 0 0 1px rgba(var(--amber),.35)}
.pl[data-u=seed]{opacity:.55}.pl[data-u=ok] .st{color:rgba(var(--ok),.95)}
.pl .n{margin-top:12px;font-size:14px;font-weight:500;color:rgba(var(--cream),.96)}.pl .st{margin-top:3px;font-size:13px;color:rgba(var(--cream),.82)}
.pl[data-u=high] .st{color:#F0B866}.pl .dt{margin-top:2px;font-size:11.5px;color:rgba(var(--cream),.48)}
.pop{position:absolute;z-index:5;width:210px;padding:10px;border-radius:14px;background:rgba(18,20,24,.88);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.5)}
.pop .h{font-size:11px;color:rgba(var(--cream),.5);padding:2px 6px 8px}.pop .a{display:flex;justify-content:space-between;padding:8px 8px;border-radius:8px;font-size:13px}.pop .a:first-of-type{background:rgba(var(--cream),.08)}.pop .a kbd{font:11px Inter;color:rgba(var(--cream),.4)}
.dock{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-radius:999px;background:rgba(18,20,24,.7);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.dock input{all:unset;width:360px;font-size:13.5px;color:rgba(var(--cream),.55)}
.col{position:absolute;top:84px}
.strip{position:absolute;left:64px;right:64px;display:grid;gap:12px}
.strip .card{border:0;padding:12px 14px;border-radius:14px;background:rgba(var(--cream),.035);box-shadow:inset 0 0 0 .5px rgba(var(--cream),.08)}
.tag{position:absolute;right:24px;bottom:14px;font-size:10px;letter-spacing:.14em;color:rgba(var(--cream),.25);text-transform:uppercase}
</style><script src="spheres.js"></script></head><body>
<div class="nav"><span>HOME</span><b>UNIVERSE</b><span>LAGE</span><span>STILL</span></div>
<div id="root"></div><div class="tag" id="tag"></div>
<script>
const Q=new URLSearchParams(location.search), V=(Q.get('v')||'A').toUpperCase(), HOVER=Q.get('hover');
const COL={post:'#5aa7dc',werkstatt:'#d0875a',wissen:'#8f86e0',finanzen:'#d9b26a',wache:'#bcd8e4',betrieb:'#b07ac0',markt:'#e29579'};
fetch(Q.get('data')).then(r=>r.json()).then(D=>{
  const root=document.getElementById('root'); const P=Object.fromEntries(D.planets.map(p=>[p.key,p]));
  const urgent=D.queue.length;
  const greet=`<div class="eyebrow">Mittwoch · 14. Oktober · 08:45</div><h1>Guten Morgen, Marius.</h1><div class="sub">${urgent} Dinge brauchen dich. Der Rest läuft.</div>`;
  const card=(q,i,btn=true)=>`<div class="card"><span class="dot" style="background:${COL[q.planet]}"></span><div><div class="t">${q.title}</div><div class="w">${q.why}</div><div class="p">${P[q.planet].label}</div></div>${btn?`<span class="btn ${i===0?'primary':''}">${q.action}</span>`:''}</div>`;
  const log=`<ul class="log">${D.log.map(l=>`<li><span>${l.when}</span>${l.text}</li>`).join('')}</ul>`;
  const lenses=`<div class="chips">${D.lenses.map((l,i)=>`<span class="chip ${i===0?'on':''}">${l.label}${l.n?`<i>${l.n}</i>`:''}</span>`).join('')}</div>`;
  function map(cx,cy,R,d){ let h=`<div class="ring" style="left:${cx}px;top:${cy}px;width:${R*2}px;height:${R*2}px"></div><div class="core" style="left:${cx}px;top:${cy}px"><div><b>MÔRA</b><small>${D.log.length} erledigt</small></div></div>`;
    D.planets.forEach((p,i)=>{ const a=-Math.PI/2+i*2*Math.PI/D.planets.length; const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R; const dd=p.urgency==='seed'?d*.62:d;
      h+=`<div class="pl" data-u="${p.urgency}" style="left:${x}px;top:${y+dd*.34}px;--d:${dd}px"><div class="s"><img src="${sphereURL(p.arch,(i+3)*41,Math.round(dd*1.3*2))}">${p.badge?`<span class="badge">${p.badge}</span>`:''}</div><div class="n">${p.label}</div><div class="st">${p.status}</div><div class="dt">${p.detail}</div></div>`;
      if(HOVER===p.key){ h+=`<div class="pop" style="left:${x+dd/2+18}px;top:${y-dd/2}px"><div class="h">${p.label} · nächste Schritte</div>${p.actions.map((a,k)=>`<div class="a">${a}<kbd>${k===0?'↵':''}</kbd></div>`).join('')}</div>`; } });
    return h; }
  const dock=`<div class="dock"><input value="Frag MÔRA oder sag, was zu tun ist …"><span class="btn primary">⌘K</span></div>`;
  if(V==='A'){
    root.innerHTML=`<div class="col" style="left:64px;width:330px">${greet}<div style="height:28px"></div><p class="sec">Jetzt wichtig</p>${D.queue.map((q,i)=>card(q,i)).join('')}</div>
    <div class="map">${map(720,452,232,78)}</div>
    <div class="col" style="right:64px;width:280px"><p class="sec">MÔRA hat erledigt</p>${log}<div style="height:30px"></div><p class="sec">Bereiche als Linse</p>${lenses}</div>${dock}`;
    document.getElementById('tag').textContent='A · Arbeitskarte';
  } else {
    root.innerHTML=`<div class="col" style="left:64px;width:420px">${greet}</div>
    <div class="col" style="right:64px;width:460px;top:96px"><p class="sec" style="text-align:right">Bereiche als Linse</p><div style="display:flex;justify-content:flex-end">${lenses}</div></div>
    <div class="strip" style="top:212px;grid-template-columns:repeat(4,1fr)">${D.queue.map((q,i)=>card(q,i)).join('')}</div>
    <div class="map">${map(540,575,150,56)}</div>
    <div class="col" style="right:64px;width:380px;top:452px"><p class="sec">MÔRA hat erledigt</p>${log}</div>${dock}`;
    document.getElementById('tag').textContent='B · Warteschlange oben';
  }
  document.body.dataset.ready='1';
});
</script></body></html>
